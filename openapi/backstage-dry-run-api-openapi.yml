openapi: 3.2.0
info:
  title: scaffolder Dry Run API
  version: '1'
  description: The Backstage backend plugin that helps you create new things
  license:
    name: Apache-2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  contact: {}
servers:
- url: /
tags:
- name: Dry Run
paths:
  /v2/dry-run:
    post:
      operationId: DryRun
      description: Perform a dry-run of a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: object
                values:
                  $ref: '#/components/schemas/JsonObject'
                secrets:
                  type: object
                  additionalProperties:
                    type: string
                directoryContents:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
                      base64Content:
                        type: string
              required:
              - template
              - values
              - directoryContents
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DryRunResult'
                - type: object
                  properties:
                    steps:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          action:
                            type: string
                        required:
                        - id
                        - name
                        - action
                        additionalProperties: {}
                    directoryContents:
                      type: array
                      items:
                        type: object
                        properties:
                          path:
                            type: string
                          executable:
                            type: boolean
                          base64Content:
                            type: string
                        required:
                        - path
                        - base64Content
                  required:
                  - steps
        '400':
          description: Validation errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationError'
                required:
                - errors
      parameters: []
      tags:
      - Dry Run
      summary: Dry run
      x-summary-source: derived
components:
  schemas:
    ValidationError:
      type: object
      properties:
        path:
          type: array
          items:
            oneOf:
            - type: string
            - type: integer
        property:
          type: string
        message:
          type: string
        instance:
          type: object
        name:
          type: string
        argument:
          oneOf:
          - type: boolean
          - type: number
          - type: object
          - type: string
        stack:
          type: string
      required:
      - path
      - property
      - message
      - schema
      - instance
      - name
      - argument
      - stack
      additionalProperties: {}
    TaskStatus:
      type: string
      enum:
      - cancelled
      - completed
      - failed
      - open
      - processing
      - skipped
      description: The status of each step of the Task
    DryRunResult:
      type: object
      properties:
        log:
          type: array
          items:
            type: object
            properties:
              body:
                allOf:
                - $ref: '#/components/schemas/JsonObject'
                - type: object
                  properties:
                    message:
                      type: string
                    status:
                      $ref: '#/components/schemas/TaskStatus'
                    stepId:
                      type: string
                  required:
                  - message
            required:
            - body
        directoryContents:
          type: array
          items:
            $ref: '#/components/schemas/SerializedFile'
        output:
          $ref: '#/components/schemas/JsonObject'
      required:
      - log
      - directoryContents
      - output
    SerializedFile:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
        executable:
          type: boolean
        symlink:
          type: boolean
      required:
      - path
      - content
    JsonObject:
      type: object
      properties: {}
      description: A type representing all allowed JSON object values.
      additionalProperties: {}
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
