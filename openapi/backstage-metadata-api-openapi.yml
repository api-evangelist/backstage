openapi: 3.2.0
info:
  title: Backstage TechDocs Metadata API
  description: The Backstage TechDocs API provides endpoints for generating, publishing, and serving technical documentation for catalog entities. TechDocs uses MkDocs under the hood to render Markdown documentation into static HTML pages. The API supports fetching rendered documentation, syncing docs from external storage, retrieving metadata, and managing documentation lifecycle.
  version: 1.0.0
  contact:
    name: Backstage
    url: https://backstage.io
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://localhost:7007/api/techdocs
  description: Local development server
tags:
- name: Metadata
paths:
  /metadata/techdocs/{namespace}/{kind}/{name}:
    get:
      operationId: getTechDocsMetadata
      summary: Backstage Get TechDocs metadata for an entity
      description: Returns the TechDocs metadata for a specific catalog entity, including the site name, description, and build information.
      tags:
      - Metadata
      security:
      - bearerAuth: []
      parameters:
      - name: namespace
        in: path
        required: true
        description: The entity namespace.
        schema:
          type: string
          default: default
      - name: kind
        in: path
        required: true
        description: The entity kind (e.g., Component, API).
        schema:
          type: string
      - name: name
        in: path
        required: true
        description: The entity name.
        schema:
          type: string
      responses:
        '200':
          description: TechDocs metadata for the entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechDocsMetadata'
        '404':
          description: No TechDocs found for the specified entity.
  /metadata/entity/{namespace}/{kind}/{name}:
    get:
      operationId: getEntityMetadata
      summary: Backstage Get entity metadata for TechDocs
      description: Returns catalog entity metadata relevant to TechDocs rendering, including the entity name, description, and TechDocs annotations.
      tags:
      - Metadata
      security:
      - bearerAuth: []
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: kind
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Entity metadata for TechDocs.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Entity not found.
components:
  schemas:
    TechDocsMetadata:
      type: object
      properties:
        site_name:
          type: string
          description: The name of the documentation site.
        site_description:
          type: string
          description: Description of the documentation site.
        etag:
          type: string
          description: ETag for cache validation.
        build_timestamp:
          type: string
          format: date-time
          description: Timestamp of the last documentation build.
        files:
          type: array
          items:
            type: string
          description: List of files in the documentation bundle.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: Backstage TechDocs Documentation
  url: https://backstage.io/docs/features/techdocs/
