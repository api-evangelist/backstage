openapi: 3.2.0
info:
  title: Backstage TechDocs Sync API
  description: The Backstage TechDocs API provides endpoints for generating, publishing, and serving technical documentation for catalog entities. TechDocs uses MkDocs under the hood to render Markdown documentation into static HTML pages. The API supports fetching rendered documentation, syncing docs from external storage, retrieving metadata, and managing documentation lifecycle.
  version: 1.0.0
  contact:
    name: Backstage
    url: https://backstage.io
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://localhost:7007/api/techdocs
  description: Local development server
tags:
- name: Sync
paths:
  /sync/{namespace}/{kind}/{name}:
    post:
      operationId: syncTechDocs
      summary: Backstage Trigger TechDocs sync
      description: Triggers a synchronization of the TechDocs content for the specified entity from the configured external storage provider.
      tags:
      - Sync
      security:
      - bearerAuth: []
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: kind
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Sync completed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Entity not found.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: Backstage TechDocs Documentation
  url: https://backstage.io/docs/features/techdocs/
