openapi: 3.2.0
info:
  title: Backstage Actions API
  version: '1.0'
  description: 'Operations tagged Actions across 2 of this provider''s published API definitions: backstage-scaffolder-backend-openapi.yaml, backstage-scaffolder-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
- url: https://localhost:7007/api/scaffolder
  description: Local development server
tags:
- name: Actions
paths:
  /v2/actions:
    get:
      operationId: ListActions
      description: Returns a list of all installed actions.
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListActionsResponse'
      security:
      - {}
      - JWT: []
      parameters: []
      tags:
      - Actions
      summary: List actions
      x-summary-source: derived
    servers:
    - url: /
components:
  schemas:
    JsonObject:
      type: object
      properties: {}
      description: A type representing all allowed JSON object values.
      additionalProperties: {}
    Action:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
        examples:
          type: array
          items:
            $ref: '#/components/schemas/ActionExample'
        schema:
          type: object
          properties:
            input:
              $ref: '#/components/schemas/JsonObject'
            output:
              $ref: '#/components/schemas/JsonObject'
      required:
      - id
      description: The response shape for a single action in the `listActions` call to the `scaffolder-backend`
    ActionExample:
      type: object
      properties:
        description:
          type: string
        example:
          type: string
      required:
      - description
      - example
      description: A single action example
    ListActionsResponse:
      type: array
      items:
        $ref: '#/components/schemas/Action'
      description: The response shape for the `listActions` call to the `scaffolder-backend`
    Action_2:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the action.
          example: fetch:plain
        description:
          type: string
          description: A human-readable description of the action.
        schema:
          type: object
          properties:
            input:
              type: object
              description: JSON Schema for the action input.
            output:
              type: object
              description: JSON Schema for the action output.
  responses:
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  name:
                    type: string
                  message:
                    type: string
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Backstage token returned by the identity API.
externalDocs:
  description: Backstage Software Templates Documentation
  url: https://backstage.io/docs/features/software-templates/
x-refined-from:
- backstage-scaffolder-backend-openapi.yaml
- backstage-scaffolder-openapi.yml
