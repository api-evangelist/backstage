created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Developer Portal
  - Open Source
  - CNCF
  - Internal Developer Platform
description: Backstage is an open-source CNCF Incubation project for building developer portals. The
  framework itself is free under the Apache 2.0 license and self-hosted by adopters; cost is operational
  (compute, hosting, internal engineering). Several commercial distributions and managed offerings exist
  built on Backstage (Spotify Portal for Backstage, Roadie, Red Hat Developer Hub / RHDH, Frontside Effection,
  Liatrio managed Backstage), each with their own pricing models. Pricing for the commercial distributions
  is mostly contact-sales or per-developer subscription.
notes: Open-source pricing is $0 / Apache-2.0; commercial distribution pricing varies and is generally
  not published. Reconciled=false reflects the lack of a single canonical pricing surface for the project.
sources:
  - https://backstage.io/
  - https://backstage.io/docs/overview/what-is-backstage/
  - https://github.com/backstage/backstage
plans:
  - id: backstage-open-source
    name: Backstage Open Source
    type: freemium
    description: Apache 2.0-licensed open-source framework. Self-hosted by adopters. No license fee.
    entries:
      - label: Open-source license
        name: open_source
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Software Catalog
      - name: Software Templates / Scaffolder
      - name: TechDocs
      - name: Search
      - name: Open-source plugin ecosystem
      - name: Community Discord support
  - id: backstage-spotify-portal
    name: Spotify Portal for Backstage (Commercial)
    type: subscription
    description: Spotify-built commercial distribution of Backstage with managed deployment, premium
      Spotify plugins (Soundcheck, Insights, Skill Exchange, RBAC), and enterprise support. Pricing
      is per-developer-per-month, contact sales.
    entries:
      - label: Spotify Portal subscription
        name: spotify_portal
        type: subscription
        metric: developer
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: true
    elements:
      - name: Hosted / managed Backstage
      - name: Soundcheck (engineering health checks)
      - name: Insights (usage analytics)
      - name: Skill Exchange
      - name: RBAC plugin
      - name: Enterprise support
  - id: backstage-roadie
    name: Roadie (Managed Backstage)
    type: subscription
    description: Roadie is a SaaS Backstage distribution with per-user pricing (typically tiered Free
      / Team / Enterprise). Contact Roadie for current pricing.
    entries:
      - label: Roadie subscription
        name: roadie
        type: subscription
        metric: user
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see https://roadie.io/pricing/
        userMultiplied: true
    elements:
      - name: Hosted Backstage
      - name: SaaS plugin marketplace
      - name: SSO / RBAC
      - name: Enterprise support
  - id: backstage-rhdh
    name: Red Hat Developer Hub (RHDH)
    type: subscription
    description: Red Hat's enterprise-supported Backstage distribution. Bundled into Red Hat OpenShift
      Platform Plus subscriptions or available standalone via Red Hat sales.
    entries:
      - label: RHDH subscription
        name: rhdh
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact Red Hat sales
        userMultiplied: false
    elements:
      - name: Productized Backstage
      - name: Bundled with OpenShift Platform Plus
      - name: Red Hat enterprise support
