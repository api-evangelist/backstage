specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Backstage
providerId: backstage
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Developer Portal
  - Open Source
  - Rate Limiting
description: Backstage is a self-hosted open-source application; there is no central provider-published
  rate limit. Rate limits in a Backstage deployment derive from (a) the operator's own ingress / API
  gateway, (b) the underlying integrations (GitHub, GitLab, Bitbucket, Jenkins, Kubernetes, etc.) which
  Backstage proxies, and (c) the database / queue backends. Commercial distributions (Spotify Portal,
  Roadie, RHDH) may publish their own SaaS-tenant limits.
notes: As an open-source self-hosted framework, Backstage itself does not enforce or publish API rate
  limits. Limits below are integration-derived and operator-configured rather than Backstage-defined.
sources:
  - https://backstage.io/docs/
  - https://backstage.io/docs/overview/architecture-overview
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Operator-configured ingress rate limit
    scope: deployment
    metric: varies
    limit: see operator's reverse proxy / API gateway configuration
  - name: GitHub integration throttling
    scope: integration
    metric: varies
    limit: see GitHub REST/GraphQL rate limits (5,000 req/hour authenticated, 15,000 GraphQL points/hour)
  - name: GitLab integration throttling
    scope: integration
    metric: varies
    limit: see GitLab.com or self-hosted GitLab rate limit settings
  - name: Bitbucket integration throttling
    scope: integration
    metric: varies
    limit: see Bitbucket API rate limits (1,000 req/hour anonymous; higher authenticated)
  - name: Kubernetes API throttling
    scope: integration
    metric: varies
    limit: see kube-apiserver QPS / Burst configuration on target cluster
  - name: TechDocs build queue
    scope: deployment
    metric: varies
    limit: operator-configured
policies:
  - name: Configure backend rate limiting
    description: Production Backstage deployments should add rate limiting at the reverse proxy / API
      gateway tier (e.g., NGINX limit_req, Envoy local_rate_limit) to protect the backend.
  - name: Cache integration calls
    description: Backstage caches catalog data in its database; tune refresh intervals to avoid hammering
      upstream GitHub/GitLab/Jenkins APIs.
  - name: Honor upstream Retry-After
    description: Plugins that proxy upstream APIs should propagate Retry-After to consumers and back
      off when 429 is returned.
  - name: Use authenticated tokens
    description: Always integrate with GitHub/GitLab using authenticated tokens (PAT or GitHub App) to
      get the higher rate-limit allotment.
  - name: Distribute Scaffolder workers
    description: For high template-execution volume, deploy multiple Scaffolder workers behind a queue
      to avoid synchronous bottlenecks.
