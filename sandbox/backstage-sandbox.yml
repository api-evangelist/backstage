description: >-
  Backstage has no test-mode/live-mode key split, because there is no vendor-operated API to key
  into. What it offers instead is stronger in one respect and weaker in another: the project runs a
  fully public demo deployment anyone can browse and call, and every adopter's local `yarn dev`
  instance is itself a sandbox. There are no published test credentials, test cards or fixture
  values, and none are invented here.
