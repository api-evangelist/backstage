specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Backstage
providerId: backstage
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Developer Portal
  - Open Source
  - Internal Developer Platform
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for Backstage: open-source framework with no license cost; total cost
  of ownership is dominated by the underlying compute, database, storage, observability, and engineering
  time to operate the portal. Commercial distributions (Spotify Portal, Roadie, RHDH) introduce per-developer
  subscription cost on top.'
notes: Backstage open-source itself has no license fee; the FinOps shape captures operating cost (infrastructure
  + engineering) plus optional commercial-distribution subscription. Reconciled=false reflects the absence
  of a single canonical pricing surface.
sources:
  - https://backstage.io/
  - https://backstage.io/docs/overview/architecture-overview
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: CNCF / Backstage Community
serviceCategory: Developer Tools
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Adjustment
focusColumns:
  ServiceName: Backstage
  ServiceCategory: Developer Tools
  ProviderName: CNCF / Backstage
  PublisherName: CNCF / Backstage Community
  InvoiceIssuerName: varies (self-hosted; Spotify, Roadie, Red Hat for commercial)
  PricingCategory: Open Source / Subscription
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: hosting_compute
    description: Cluster compute time hosting Backstage frontend / backend / scaffolder workers
    unit: instance-hour
    aggregation: sum
    dimensions:
      - environment
      - region
  - name: database_storage
    description: PostgreSQL / managed DB capacity backing the Backstage catalog
    unit: GB-month
    aggregation: avg
  - name: techdocs_storage
    description: TechDocs static-site storage (typically S3 / Blob)
    unit: GB-month
    aggregation: avg
  - name: integration_api_calls
    description: Calls into upstream developer tools (GitHub, GitLab, Jenkins, Jira, Kubernetes) made
      by Backstage on behalf of users
    unit: request
    aggregation: sum
    dimensions:
      - integration
  - name: developer_seats
    description: Per-developer subscription for commercial Backstage distributions (Spotify Portal, Roadie,
      RHDH)
    unit: developer
    aggregation: max
    dimensions:
      - distribution
principles:
  - name: Visibility
    description: Tag the cluster / namespace running Backstage in your cloud cost tool (Cost Management,
      OpenCost) to surface compute, DB, and storage spend; track plugin activity via Backstage Insights
      or equivalent.
  - name: Allocation
    description: Treat Backstage as a shared platform service; chargeback to consuming teams via developer-seat
      counts or use developer-experience platform team budget.
  - name: Optimization
    description: Right-size frontend / backend pods; cache catalog data aggressively to reduce upstream
      API calls; tune Scaffolder concurrency; archive unused plugins; evaluate commercial-distribution
      ROI vs in-house engineering cost.
  - name: Accountability
    description: Assign a Backstage platform owner; review monthly per-team plugin usage and developer
      activity; renegotiate commercial-distribution subscriptions at renewal based on active developer
      counts.
maintainers:
