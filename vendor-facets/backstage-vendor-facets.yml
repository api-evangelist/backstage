# Vendor facets — Backstage. Spotify's open-source framework for INTERNAL developer portals: a
# software catalog with API entities, TechDocs, templates and plugins, now with an MCP actions
# backend. The headline: almost nothing reaches a public Kin Score. A Backstage instance sits
# behind SSO for a company's own engineers, and the score reads only what a provider publishes.
vendor: backstage
name: Backstage
website: https://backstage.io
areas:
- developer-portal
registry_keys: []
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Backstage is built for internal engineering: a catalog of services and APIs (openapi, asyncapi, graphql,
  grpc definitions), TechDocs and scaffolding, all inside a client-side React app that usually sits behind
  single sign-on. None of that is the public surface the Kin Score reads. The portal, documentation and
  reference pointers are reachable only by the rare provider that runs a public, unauthenticated Backstage
  and declares it, and even then the React shell hides content from non-JavaScript readers. Its MCP actions
  backend exposes Backstage's own actions behind backend auth, not the provider's API. Backstage matters
  to a public score only indirectly, by keeping the internal contracts a provider later publishes in order.
features:
- id: software-catalog
  name: Software Catalog with API entities
  description: >-
    Catalog entities including kind API, whose spec.definition holds an openapi, asyncapi, graphql or
    grpc definition.
  source: https://backstage.io/docs/features/software-catalog/descriptor-format
  tier: open-source
- id: techdocs
  name: TechDocs
  description: >-
    Docs-like-code Markdown built with MkDocs, stored in object storage and rendered inside Backstage's
    client-side React app.
  source: https://backstage.io/docs/features/techdocs/
  tier: open-source
- id: internal-portal
  name: Internal developer portal framework
  description: >-
    Catalog, Software Templates, TechDocs and a plugin ecosystem aimed at an organisation's own engineers,
    managers and platform teams.
  source: https://backstage.io/docs/overview/what-is-backstage/
  tier: open-source
- id: mcp-actions
  name: MCP Actions Backend
  description: >-
    Exposes actions registered in Backstage's Actions Registry as MCP tools at /api/mcp-actions/v1, behind
    Backstage backend authentication by default.
  source: https://backstage.io/docs/ai/mcp-actions/
  tier: open-source
maps:
- feature: internal-portal
  check: portal_present
  layer: composite
  conditional: true
  condition: >-
    Only for a Backstage instance served publicly without SSO and declared as the provider's DeveloperPortal.
    Almost every deployment is internal.
  catalog_pass_rate: 0.228
  facet: developer_ergonomics
  points: 4
  baseline_pass_rate: 0.633
- feature: techdocs
  check: documentation_present
  layer: composite
  conditional: true
  condition: Only when TechDocs are public and declared as Documentation. Behind SSO, the score never
    sees them.
  catalog_pass_rate: 0.453
  facet: developer_ergonomics
  points: 4
  baseline_pass_rate: 0.95
  saturated: true
  saturated_note: >-
    95% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
- feature: software-catalog
  check: api_reference_present
  layer: composite
  conditional: true
  condition: >-
    Only when an API entity's rendered definition is public and declared as an APIReference. The React
    app renders client-side, so a non-JavaScript reader sees a shell.
  catalog_pass_rate: 0.222
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.942
  saturated: true
  saturated_note: >-
    94% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
earns_nothing:
- feature: mcp-actions
  check: mcp_server
  layer: agent_readiness
  why: The tools are Backstage's own registered actions behind backend auth, not the provider's API.
- feature: software-catalog
  check: contract_present
  why: >-
    An API entity stores a definition inside the catalog. It is not a published contract until the provider
    publishes the OpenAPI itself.
- feature: software-catalog
  check: apis_yml_present
  why: A catalog-info.yaml is Backstage's descriptor, not an APIs.json index.
out_of_reach:
  checks:
  - sdk_count_1
  - cli_present
  - llms_txt_published
  - sign_up_present
  - pricing_link
  - terms_of_service
  - console_or_sandbox
  - change_log_present
  - agent_skills
  note: Backstage has no public onboarding, access, SDK or agent-facing surface for an external developer.
unscored_practice:
- feature: software-catalog
  why: >-
    Internal API cataloguing with ownership and lifecycle is the governance that precedes good public
    contracts. No public check can see it.
surface:
  developer_ergonomics:
    reachable: 11.0
    total: 42
  agent_readiness:
    reachable: 0
    total: 139
hard_rule: >-
  A model, not a score. Adopting this vendor changes a provider's Kin Score only when the provider publishes
  the resulting artifacts on its own surface; nothing here writes a score, and no sponsorship or partnership
  can.
