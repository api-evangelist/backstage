name: Backstage MCP Actions Backend
description: Backstage ships a first-party MCP server as the @backstage/plugin-mcp-actions-backend plugin.
  It exposes every action registered with the Backstage Actions Registry as an MCP tool over the Streamable
  HTTP transport, served by the adopter's own Backstage backend at /api/mcp-actions/v1. Because Backstage
  is self-hosted there is no vendor-operated production endpoint; the Backstage project does, however,
  run a public demo instance whose MCP endpoint answered an unauthenticated tools/list during this pass,
  so the tool set below is observed, not inferred.
