provider: Backstage
providerId: backstage
name: Backstage MCP Actions Backend
description: >-
  Backstage ships a first-party MCP server as the @backstage/plugin-mcp-actions-backend plugin. It
  exposes every action registered with the Backstage Actions Registry as an MCP tool over the
  Streamable HTTP transport, served by the adopter's own Backstage backend at /api/mcp-actions/v1.
  Because Backstage is self-hosted there is no vendor-operated production endpoint; the Backstage
  project does, however, run a public demo instance whose MCP endpoint answered an unauthenticated
  tools/list during this pass, so the tool set below is observed, not inferred.
deployment:
  mode: both
  endpoint: https://demo.backstage.io/api/mcp-actions/v1
  endpoint_note: >-
    This is the Backstage project's public DEMO instance, not a production API. It answered
    initialize (serverInfo "My Backstage Demo", version 0.2.2-next.0, protocolVersion 2025-06-18)
    and tools/list anonymously on 2026-09-04. Real adopters run their own endpoint at
    https://<their-backstage-host>/api/mcp-actions/v1.
  install: "yarn --cwd packages/backend add @backstage/plugin-mcp-actions-backend"
  package: https://www.npmjs.com/package/@backstage/plugin-mcp-actions-backend
  auth: oauth
  auth_note: >-
    The demo instance answers anonymously. In a configured deployment the endpoint sits behind the
    Backstage auth stack; the plugin documents OAuth via Client ID Metadata Documents (CIMD).
  verified: probed
transport: streamable-http
self_hosted_endpoint_template: https://{backstage-host}/api/mcp-actions/v1
named_servers:
  description: >-
    mcpActions.servers config splits the action set into focused sub-servers, each on its own path.
    The default server at /api/mcp-actions/v1 always exposes every registered action.
  examples:
    - https://{backstage-host}/api/mcp-actions/v1/catalog
    - https://{backstage-host}/api/mcp-actions/v1/scaffolder
