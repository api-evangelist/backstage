    The Backstage Notifications API delivers user- and group-addressed notifications inside a
    Backstage portal. Plugins create notifications with a topic, severity and link; users list,
    read, mark and save them, manage per-topic delivery settings, and query unread status. It is
    served by @backstage/plugin-notifications-backend on the operator's own Backstage backend at
    /api/notifications, and the OpenAPI below is published first-party in the Backstage monorepo.
