  name: Backstage Events System
  tags:
  - Developer Portal
  - Event
  - Webhook
  tags_raw:
  - Developer Portal
  - Events
  - Webhooks
  humanURL: https://backstage.io/docs/plugins/backends-and-plugins/
  properties:
  - url: https://backstage.io/docs/plugins/backends-and-plugins/
    type: Documentation
  - url: asyncapi/backstage-events-asyncapi.yml
    type: AsyncAPI
  description: >-
    The Backstage Events system provides a publish-subscribe mechanism for broadcasting and consuming
    events within a Backstage instance. It enables plugins to emit events when significant actions occur
    (such as catalog entity changes, scaffolder task completions, or permission policy updates) and allows
    other plugins or external systems to subscribe to those events via HTTP webhooks or the internal event
    bus.
