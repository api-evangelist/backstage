naftiko: 1.0.0-alpha2
info:
  label: Backstage Scaffolder API — Actions
  description: 'Backstage Scaffolder API — Actions. 1 operations. Lead operation: Backstage List available actions. Self-contained
    Naftiko capability covering one Backstage business surface.'
  tags:
  - Backstage
  - Actions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BACKSTAGE_API_KEY: BACKSTAGE_API_KEY
capability:
  consumes:
  - type: http
    namespace: scaffolder-actions
    baseUri: https://localhost:7007/api/scaffolder
    description: Backstage Scaffolder API — Actions business capability. Self-contained, no shared references.
    resources:
    - name: v2-actions
      path: /v2/actions
      operations:
      - name: listactions
        method: GET
        description: Backstage List available actions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.BACKSTAGE_API_KEY}}'
  exposes:
  - type: rest
    namespace: scaffolder-actions-rest
    port: 8080
    description: REST adapter for Backstage Scaffolder API — Actions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v2/actions
      name: v2-actions
      description: REST surface for v2-actions.
      operations:
      - method: GET
        name: listactions
        description: Backstage List available actions
        call: scaffolder-actions.listactions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: scaffolder-actions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Backstage Scaffolder API — Actions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: backstage-list-available-actions
      description: Backstage List available actions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: scaffolder-actions.listactions
      outputParameters:
      - type: object
        mapping: $.
