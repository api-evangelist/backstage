naftiko: 1.0.0-alpha2
info:
  label: Backstage Permissions API — Authorization
  description: 'Backstage Permissions API — Authorization. 2 operations. Lead operation: Backstage Evaluate permission requests.
    Self-contained Naftiko capability covering one Backstage business surface.'
  tags:
  - Backstage
  - Authorization
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BACKSTAGE_API_KEY: BACKSTAGE_API_KEY
capability:
  consumes:
  - type: http
    namespace: permissions-authorization
    baseUri: https://localhost:7007/api/permission
    description: Backstage Permissions API — Authorization business capability. Self-contained, no shared references.
    resources:
    - name: authorize
      path: /authorize
      operations:
      - name: authorize
        method: POST
        description: Backstage Evaluate permission requests
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: plugins-pluginId-apply-conditions
      path: /plugins/{pluginId}/apply-conditions
      operations:
      - name: applyconditions
        method: POST
        description: Backstage Apply conditional permission rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pluginId
          in: path
          type: string
          description: The plugin identifier that owns the resource type.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.BACKSTAGE_API_KEY}}'
  exposes:
  - type: rest
    namespace: permissions-authorization-rest
    port: 8080
    description: REST adapter for Backstage Permissions API — Authorization. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/authorize
      name: authorize
      description: REST surface for authorize.
      operations:
      - method: POST
        name: authorize
        description: Backstage Evaluate permission requests
        call: permissions-authorization.authorize
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/plugins/{pluginid}/apply-conditions
      name: plugins-pluginid-apply-conditions
      description: REST surface for plugins-pluginId-apply-conditions.
      operations:
      - method: POST
        name: applyconditions
        description: Backstage Apply conditional permission rules
        call: permissions-authorization.applyconditions
        with:
          pluginId: rest.pluginId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: permissions-authorization-mcp
    port: 9090
    transport: http
    description: MCP adapter for Backstage Permissions API — Authorization. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: backstage-evaluate-permission-requests
      description: Backstage Evaluate permission requests
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: permissions-authorization.authorize
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: backstage-apply-conditional-permission-rules
      description: Backstage Apply conditional permission rules
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: permissions-authorization.applyconditions
      with:
        pluginId: tools.pluginId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
